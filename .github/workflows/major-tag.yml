name: Major tag

# Other repositories use `alexsilver8/cleaner@v1`. When a release like v1.2.0 is published, this
# moves the v1 tag to it, so they get the fix or new rule without changing their workflows.
# A new major version (v2.0.0) creates v2 and leaves v1 where it was.
on:
    release:
        types: [published]

permissions:
    contents: write

jobs:
    move:
        if: ${{ !github.event.release.prerelease }}
        runs-on: ubuntu-latest
        steps:
            # Checks out the commit the release is tagged on.
            - uses: actions/checkout@v7
            - name: Point the major tag at this release
              env:
                  TAG: ${{ github.event.release.tag_name }}
              run: |
                  # v1.2.0 → v1. Also handles release-please's "cleaner-v1.2.0" style tags.
                  major=$(echo "$TAG" | sed -nE 's/^(.*-)?(v[0-9]+)\.[0-9]+\.[0-9]+$/\2/p')
                  if [ -z "$major" ]; then
                    echo "::notice::$TAG isn't a version like v1.2.0; leaving the major tags alone."
                    exit 0
                  fi
                  git push --force origin "HEAD:refs/tags/$major"
                  echo "Moved $major to $TAG."
